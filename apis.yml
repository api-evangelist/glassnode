description: >-
  Glassnode provides on-chain analytics, market intelligence, and thousands of curated metrics
  covering Bitcoin, Ethereum, and other major chains. The Glassnode API serves time-series data
  for price, supply, addresses, transactions, derivatives, mining, market indicators, and
  proprietary signals (e.g. SOPR, MVRV, NUPL). Authentication uses an X-Api-Key header. API
  access requires an institutional plan or paid add-on.
apis:
  - aid: glassnode:metrics-api
    name: Glassnode Metrics API
    tags:
      - On-Chain
      - Metrics
      - Time Series
      - Indicators
      - Institutional
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.glassnode.com/v1
    humanURL: https://docs.glassnode.com/
    description: >-
      Time-series API for thousands of on-chain and market metrics across major crypto assets.
      Endpoints follow /v1/metrics/{category}/{name} pattern. Data is updated daily, hourly, or
      10-minute depending on metric. CSV and JSON output.
    properties:
      - type: Documentation
        url: https://docs.glassnode.com/
      - type: Catalog
        url: https://docs.glassnode.com/data/metric-catalog
      - type: Pricing
        url: https://studio.glassnode.com/pricing
    x-features:
      - 1,000+ metrics across BTC, ETH, ERC-20, others
      - SOPR, MVRV, NUPL, Realized Cap, others
      - Time-series JSON / CSV output
      - X-Api-Key or api_key query auth
    x-use-cases:
      - On-chain trading signals
      - Institutional research
      - Macro crypto market reports
