openapi: 3.1.0
info:
  title: Glassnode Metrics Addresses User API
  version: 1.0.0
  description: 'Best-effort OpenAPI 3.1 description of the Glassnode on-chain and market

    metrics API. Endpoints follow the /v1/metrics/{category}/{name} pattern and

    return time-series data in JSON or CSV. Authentication uses an X-Api-Key

    header. Sourced from https://docs.glassnode.com/.

    '
  contact:
    name: Glassnode API Docs
    url: https://docs.glassnode.com/
servers:
- url: https://api.glassnode.com
  description: Production
security:
- apiKey: []
tags:
- name: User
paths:
  /v1/user/api_usage:
    get:
      summary: Current-month API credit consumption
      operationId: getApiUsage
      tags:
      - User
      responses:
        '200':
          description: Usage stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  credits_used:
                    type: integer
                  credits_limit:
                    type: integer
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Glassnode API key with institutional or paid plan.
