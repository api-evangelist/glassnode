specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Glassnode
providerId: glassnode
created: '2026-05-08'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-08, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-08'
reconciled: false
tags:
  - Crypto
  - On-Chain
  - Rate Limiting
description: >-
  Glassnode enforces per-API-key rate limits and a fair-use policy. Documented soft limit is
  approximately 30 requests per second on Professional tier and higher per institutional
  contract. Throttled responses return HTTP 429.
notes: Glassnode does not publish a public rate-limit table; figures are best-effort
  reconciliation from documentation references.
sources:
  - https://docs.glassnode.com/basic-api/api-key
  - https://docs.glassnode.com/data/metric-catalog
responseCodes:
  throttled: 429
limits:
  - name: Professional API
    scope: api_key
    metric: requests_per_second
    limit: 30
    notes: Approximate soft limit.
  - name: Institutional API
    scope: api_key
    metric: requests_per_second
    limit: -1
    notes: Per-contract; commonly 100 rps or higher.
policies:
  - name: Backoff Strategy
    description: Honor 429 Retry-After; cache long-window time-series; aggregate metric requests.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
